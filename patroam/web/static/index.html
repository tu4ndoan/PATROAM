<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>PATROAM</title>
<style>
  :root { --accent:#7b5cff; --muted:#6b7488; --fg:#e8ecf7; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#05030d;
    font-family:"Courier New", ui-monospace, monospace; color:var(--fg);
    -webkit-user-select:none; user-select:none; }
  #orb { position:fixed; inset:0; display:block; }
  #ui { position:fixed; inset:0; pointer-events:none; }
  #ui > * { pointer-events:auto; }
  .brand { position:absolute; top:16px; left:20px; font-weight:bold; letter-spacing:2px;
    color:#9aa8ff; text-shadow:0 0 12px rgba(123,92,255,.7); }
  .top-right { position:absolute; top:14px; right:18px; display:flex; gap:8px; align-items:center; }
  select, .glass { background:rgba(20,16,34,.6); color:var(--fg);
    border:1px solid rgba(150,130,230,.28); border-radius:8px; padding:6px 8px;
    font-family:inherit; font-size:13px; outline:none; }
  .iconbtn { cursor:pointer; }
  .status { position:absolute; left:0; right:0; bottom:96px; text-align:center;
    color:var(--muted); font-size:13px; letter-spacing:1px; min-height:18px;
    padding:0 16px; text-shadow:0 0 10px rgba(0,0,0,.8); }
  .bar { position:absolute; left:50%; bottom:22px; transform:translateX(-50%);
    display:flex; gap:10px; align-items:center; width:min(720px, 92vw);
    background:rgba(16,12,28,.55); border:1px solid rgba(150,130,230,.22);
    border-radius:16px; padding:10px 12px; box-shadow:0 8px 40px rgba(0,0,0,.5); }
  .btn { cursor:pointer; border:1px solid rgba(150,130,230,.25); background:rgba(30,24,48,.8);
    color:var(--fg); border-radius:10px; padding:9px 12px; font-family:inherit; font-weight:bold;
    font-size:13px; white-space:nowrap; transition:.15s; }
  .btn:hover { border-color:var(--accent); }
  .btn.on { color:#22c55e; border-color:#22c55e; box-shadow:0 0 14px rgba(34,197,94,.35); }
  #text { flex:1; min-width:60px; background:rgba(8,6,16,.7); color:var(--fg);
    border:1px solid rgba(150,130,230,.25); border-radius:10px; padding:10px 12px;
    font-family:inherit; font-size:14px; outline:none; }
  #text:focus { border-color:var(--accent); }
  #send { background:var(--accent); border-color:var(--accent); color:#fff; }
  .hint { position:absolute; left:20px; bottom:26px; color:var(--muted); font-size:11px; opacity:.55; }

  /* Side chat panel */
  .chat { position:fixed; top:0; right:0; height:100%; width:340px; max-width:82vw;
    background:rgba(10,8,18,.85); border-left:1px solid rgba(150,130,230,.2);
    backdrop-filter:blur(12px); transform:translateX(0); transition:transform .25s ease;
    display:flex; flex-direction:column; z-index:5; }
  .chat.hidden { transform:translateX(100%); }
  .chat-head { padding:14px 16px; font-weight:bold; color:#9aa8ff; letter-spacing:1px;
    border-bottom:1px solid rgba(150,130,230,.15); display:flex; justify-content:space-between; }
  .chat-head .x { cursor:pointer; opacity:.7; }
  .chat-log { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .msg { padding:8px 11px; border-radius:10px; font-size:13px; line-height:1.45;
    max-width:100%; white-space:pre-wrap; word-wrap:break-word; }
  .msg.you { align-self:flex-end; background:rgba(79,142,247,.18); border:1px solid rgba(79,142,247,.35); }
  .msg.bot { align-self:flex-start; background:rgba(123,92,255,.16); border:1px solid rgba(123,92,255,.3); }
  .msg .who { display:block; font-size:10px; opacity:.6; margin-bottom:2px; }
  /* Shift the control bar left when the panel is open so it stays visible. */
  body.chat-open .bar { transform:translateX(calc(-50% - 175px)); transition:transform .25s ease; }
  @media (max-width:640px){ body.chat-open .bar { transform:translateX(-50%); } }
</style>
</head>
<body>
  <canvas id="orb"></canvas>
  <div id="ui">
    <div class="brand">⬡ PATROAM</div>
    <div class="top-right">
      <span id="chatToggle" class="glass iconbtn" title="Show/hide chat">💬</span>
      <select id="model" class="glass" title="Model"></select>
      <span id="refresh" class="glass iconbtn" title="Refresh models">⟳</span>
    </div>
    <div id="chat" class="chat hidden">
      <div class="chat-head"><span>Conversation</span><span class="x" id="chatClose">✕</span></div>
      <div id="log" class="chat-log"></div>
    </div>
    <div id="status" class="status"></div>
    <div class="hint">drag to rotate · scroll to zoom · click to pulse</div>
    <div class="bar">
      <button id="mic" class="btn" title="Tap to talk">🎙 Talk</button>
      <button id="wake" class="btn" title="Always-on wake word">😴 Always-on</button>
      <button id="tts" class="btn on" title="Speak replies">🔊</button>
      <input id="text" placeholder="Type a command, Master…" />
      <button id="send" class="btn">→</button>
    </div>
  </div>
  <script src="orb.js"></script>
  <script src="app.js"></script>
</body>
</html>
