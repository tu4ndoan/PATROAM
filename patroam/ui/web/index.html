<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>PATROAM</title>
<style>
  :root { --accent:#7b5cff; --muted:#6b7488; --fg:#e8ecf7; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#05030d;
    font-family:"Courier New", ui-monospace, monospace; color:var(--fg);
    -webkit-user-select:none; user-select:none; }
  #orb { position:fixed; inset:0; display:block; }
  #ui { position:fixed; inset:0; pointer-events:none; }
  #ui > * { pointer-events:auto; }
  .brand { position:absolute; top:16px; left:20px; font-weight:bold;
    letter-spacing:2px; color:#9aa8ff; text-shadow:0 0 12px rgba(123,92,255,.7); }
  .top-right { position:absolute; top:14px; right:18px; display:flex; gap:8px; align-items:center; }
  select, .glass { background:rgba(20,16,34,.6); color:var(--fg);
    border:1px solid rgba(150,130,230,.28); border-radius:8px; padding:6px 8px;
    font-family:inherit; font-size:13px; backdrop-filter:blur(8px); outline:none; }
  .iconbtn { cursor:pointer; }
  .status { position:absolute; left:0; right:0; bottom:96px; text-align:center;
    color:var(--muted); font-size:13px; letter-spacing:1px; min-height:18px;
    text-shadow:0 0 10px rgba(0,0,0,.8); }
  .bar { position:absolute; left:50%; bottom:22px; transform:translateX(-50%);
    display:flex; gap:10px; align-items:center; width:min(720px, 92vw);
    background:rgba(16,12,28,.55); border:1px solid rgba(150,130,230,.22);
    border-radius:16px; padding:10px 12px; backdrop-filter:blur(10px);
    box-shadow:0 8px 40px rgba(0,0,0,.5); }
  .btn { cursor:pointer; border:1px solid rgba(150,130,230,.25);
    background:rgba(30,24,48,.8); color:var(--fg); border-radius:10px;
    padding:9px 12px; font-family:inherit; font-weight:bold; font-size:13px;
    white-space:nowrap; transition:.15s; }
  .btn:hover { border-color:var(--accent); }
  .btn.on { color:#22c55e; border-color:#22c55e; box-shadow:0 0 14px rgba(34,197,94,.35); }
  .btn.rec { color:#ef4444; border-color:#ef4444; box-shadow:0 0 16px rgba(239,68,68,.4); }
  #text { flex:1; min-width:60px; background:rgba(8,6,16,.7); color:var(--fg);
    border:1px solid rgba(150,130,230,.25); border-radius:10px; padding:10px 12px;
    font-family:inherit; font-size:14px; outline:none; }
  #text:focus { border-color:var(--accent); }
  #send { background:var(--accent); border-color:var(--accent); color:#fff; }
  .hint { position:absolute; left:20px; bottom:26px; color:var(--muted); font-size:11px; opacity:.55; }

  /* Side chat panel */
  .chat { position:fixed; top:0; right:0; height:100%; width:340px; max-width:82vw;
    background:rgba(10,8,18,.85); border-left:1px solid rgba(150,130,230,.2);
    backdrop-filter:blur(12px); transform:translateX(0); transition:transform .25s ease;
    display:flex; flex-direction:column; z-index:5; }
  .chat.hidden { transform:translateX(100%); }
  .chat-head { padding:14px 16px; font-weight:bold; color:#9aa8ff; letter-spacing:1px;
    border-bottom:1px solid rgba(150,130,230,.15); display:flex; justify-content:space-between; }
  .chat-head .x { cursor:pointer; opacity:.7; }
  .chat-log { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .msg { padding:8px 11px; border-radius:10px; font-size:13px; line-height:1.45;
    max-width:100%; white-space:pre-wrap; word-wrap:break-word; }
  .msg.you { align-self:flex-end; background:rgba(79,142,247,.18); border:1px solid rgba(79,142,247,.35); }
  .msg.bot { align-self:flex-start; background:rgba(123,92,255,.16); border:1px solid rgba(123,92,255,.3); }
  .msg .who { display:block; font-size:10px; opacity:.6; margin-bottom:2px; }
  body.chat-open .bar { transform:translateX(calc(-50% - 175px)); transition:transform .25s ease; }
  @media (max-width:640px){ body.chat-open .bar { transform:translateX(-50%); } }

  /* Inspector panel (RAG + knowledge graph) — salvaged glass/neon look */
  .insp { position:fixed; top:0; left:0; height:100%; width:410px; max-width:88vw;
    background:rgba(8,10,20,.9); border-right:1px solid rgba(123,92,255,.22);
    backdrop-filter:blur(14px); transform:translateX(-100%); transition:transform .25s ease;
    display:flex; flex-direction:column; z-index:6; }
  .insp.open { transform:translateX(0); }
  .insp-head { padding:14px 16px; display:flex; justify-content:space-between; align-items:center;
    border-bottom:1px solid rgba(123,92,255,.15); }
  .insp-title { font-weight:bold; letter-spacing:2px; color:#9aa8ff; text-shadow:0 0 12px rgba(123,92,255,.6); }
  .insp-head .x { cursor:pointer; opacity:.7; }
  .tabs { display:flex; gap:6px; padding:10px 12px 0; }
  .tab { flex:1; text-align:center; cursor:pointer; padding:7px 0; font-size:11px; letter-spacing:1px;
    border:1px solid rgba(123,92,255,.2); border-radius:8px; color:var(--muted); background:rgba(20,16,34,.5); }
  .tab.sel { color:#fff; border-color:var(--accent); box-shadow:0 0 12px rgba(123,92,255,.35); }
  .pane { flex:1; overflow:auto; padding:12px; display:none; flex-direction:column; gap:10px; }
  .pane.sel { display:flex; }
  .graphwrap { position:relative; width:100%; height:300px; }
  #graphCv { width:100%; height:100%; display:block; border-radius:10px;
    border:1px solid rgba(123,92,255,.18);
    background:radial-gradient(120% 120% at 50% 0%, rgba(40,30,70,.5), rgba(6,5,14,.9)); }
  .graphwrap.full { position:fixed; inset:0; width:auto; height:auto; z-index:30; }
  .graphwrap.full #graphCv { border-radius:0; border:none;
    background:radial-gradient(120% 120% at 50% -10%, rgba(34,24,64,.98), rgba(3,2,9,1)); }
  .gexpand { position:absolute; top:8px; right:8px; z-index:31; cursor:pointer; font-size:14px;
    width:28px; height:28px; line-height:26px; text-align:center; border-radius:7px;
    background:rgba(20,16,34,.7); border:1px solid rgba(123,92,255,.3); color:#bdb6ff;
    backdrop-filter:blur(6px); }
  .gexpand:hover { border-color:var(--accent); box-shadow:0 0 12px rgba(123,92,255,.4); }
  #graphCv { cursor:grab; touch-action:none; }
  #graphCv:active { cursor:grabbing; }
  .kg-search { position:absolute; top:8px; left:8px; z-index:31; width:150px; font-size:12px;
    padding:6px 9px; }
  .graphwrap.full .kg-search { width:280px; top:14px; left:14px; }
  .ghint { display:none; position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
    z-index:31; pointer-events:none; font-size:11px; color:rgba(180,190,230,.7);
    text-shadow:0 0 8px rgba(0,0,0,.8); }
  .graphwrap.full .ghint { display:block; }
  .kg-overlay { display:none; position:absolute; left:14px; bottom:14px; z-index:31;
    width:300px; max-height:62%; overflow:auto; padding:12px 14px; border-radius:12px;
    background:rgba(10,8,18,.85); border:1px solid rgba(123,92,255,.3); backdrop-filter:blur(10px); }
  .graphwrap.full .kg-overlay.show { display:block; }
  .kg-detail:empty { display:none; }
  .kg-detail { padding:10px 12px; border-radius:10px; background:rgba(20,16,34,.45);
    border:1px solid rgba(123,92,255,.2); }
  .detail-title { font-weight:bold; color:#cdd2ff; font-size:14px; display:flex;
    justify-content:space-between; align-items:center; }
  .detail-clear { cursor:pointer; color:#9aa8ff; opacity:.7; font-size:12px; padding:0 4px; }
  .detail-clear:hover { opacity:1; color:#fff; }
  .detail-sub { color:#7aa2ff; font-size:11px; margin:2px 0 8px; }
  .detail-rel { font-size:12px; line-height:1.7; color:#c7cce0; }
  .detail-rel .r { color:#7aa2ff; }
  .detail-rel b { color:#e8ecf7; }
  .meta { font-size:12px; color:var(--muted); }
  .meta b { color:#9aa8ff; }
  .chip { display:inline-block; font-size:11px; padding:2px 8px; margin:2px; border-radius:20px;
    border:1px solid rgba(123,92,255,.3); color:#bdb6ff; }
  .kg-list { font-size:12px; line-height:1.7; color:#c7cce0; }
  .kg-list .rel { color:#7aa2ff; }
  .row { display:flex; gap:8px; }
  .row input { flex:1; }
  .hit { border:1px solid rgba(123,92,255,.18); border-radius:10px; padding:8px 10px;
    background:rgba(20,16,34,.4); font-size:12px; }
  .hit .src { color:#7aa2ff; font-weight:bold; }
  .hit .score { float:right; color:#22c55e; }
  .hit .txt { margin-top:4px; color:#c7cce0; line-height:1.45; max-height:96px; overflow:auto; white-space:pre-wrap; }
  .smallbtn { cursor:pointer; border:1px solid rgba(123,92,255,.3); background:rgba(30,24,48,.8);
    color:var(--fg); border-radius:8px; padding:7px 10px; font-family:inherit; font-size:12px; white-space:nowrap; }
  .smallbtn:hover { border-color:var(--accent); }
  .empty { color:var(--muted); font-size:12px; text-align:center; padding:20px 0; }
</style>
</head>
<body>
  <canvas id="orb"></canvas>
  <div id="ui">
    <div class="brand">⬡ PATROAM</div>
    <div class="top-right">
      <span id="inspToggle" class="glass iconbtn" title="RAG &amp; knowledge graph inspector">🧠</span>
      <span id="chatToggle" class="glass iconbtn" title="Show/hide chat">💬</span>
      <select id="model" class="glass" title="Model"></select>
      <span id="refresh" class="glass iconbtn" title="Refresh models">⟳</span>
    </div>

    <div id="insp" class="insp">
      <div class="insp-head"><span class="insp-title">⬡ INSPECTOR</span><span class="x" id="inspClose">✕</span></div>
      <div class="tabs">
        <div class="tab sel" data-tab="kg">KNOWLEDGE GRAPH</div>
        <div class="tab" data-tab="rag">RAG</div>
      </div>
      <div id="pane-kg" class="pane sel">
        <div id="graphWrap" class="graphwrap">
          <input id="kgSearch" class="kg-search glass" placeholder="🔍 Search node…" />
          <canvas id="graphCv"></canvas>
          <span class="gexpand" id="gExpand" title="Expand / collapse">⤢</span>
          <div class="ghint">drag to rotate · scroll to zoom · click a node to focus · Esc to exit</div>
          <div class="kg-overlay" id="kgOverlay"></div>
        </div>
        <div class="meta" id="kgMeta">Loading…</div>
        <div class="kg-detail" id="kgDetail"></div>
        <div class="kg-list" id="kgList"></div>
      </div>
      <div id="pane-rag" class="pane">
        <div class="meta" id="ragMeta">Loading…</div>
        <div id="ragSources"></div>
        <div class="row">
          <input id="ragQ" class="glass" placeholder="Test a retrieval query…" />
          <span class="smallbtn" id="ragGo">Search</span>
        </div>
        <span class="smallbtn" id="ragReindex">⟳ Re-index documents</span>
        <div id="ragHits"></div>
      </div>
    </div>
    <div id="chat" class="chat hidden">
      <div class="chat-head"><span>Conversation</span><span class="x" id="chatClose">✕</span></div>
      <div id="log" class="chat-log"></div>
    </div>
    <div id="status" class="status"></div>
    <div class="hint">drag to rotate · scroll to zoom · click to pulse</div>
    <div class="bar">
      <button id="mic" class="btn" title="Hold to talk">🎙 Hold</button>
      <button id="wake" class="btn" title="Always-on wake word">😴 Always-on</button>
      <button id="tts" class="btn on" title="Speak replies">🔊</button>
      <input id="text" placeholder="Type a command, Master…" />
      <button id="send" class="btn">→</button>
    </div>
  </div>

<script>
"use strict";
// ── Neural-network orb, pure Canvas2D (no WebGL / no libraries / offline) ──────
const cv = document.getElementById('orb');
const ctx = cv.getContext('2d');
let DPR = Math.min(window.devicePixelRatio || 1, 1.5);
let W=0, H=0;
function resize(){ W=innerWidth; H=innerHeight; cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0); makeStars(); }
addEventListener('resize', resize);

const lerp=(a,b,t)=>a+(b-a)*t;
function hex(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function mix(a,b,t){ return [Math.round(lerp(a[0],b[0],t)),Math.round(lerp(a[1],b[1],t)),Math.round(lerp(a[2],b[2],t))]; }
function rgba(c,a){ return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

// ── State presets (purple-nebula → magenta) ────────────────────────────────────
const STATES = {
  idle:      { c1:hex('#3357ff'), c2:hex('#c23bff'), spin:0.05, flow:0.8, energy:0.55, auto:0 },
  sleeping:  { c1:hex('#2f6bff'), c2:hex('#b13bff'), spin:0.06, flow:0.7, energy:0.6,  auto:0 },
  listening: { c1:hex('#2f9bff'), c2:hex('#ff3bd0'), spin:0.16, flow:1.6, energy:1.0,  auto:3.0 },
  thinking:  { c1:hex('#6a4bff'), c2:hex('#ff3bd0'), spin:0.30, flow:2.2, energy:1.0,  auto:1.5 },
  speaking:  { c1:hex('#22c3ff'), c2:hex('#ff4bd6'), spin:0.20, flow:2.0, energy:1.2,  auto:1.1 },
};
let target = STATES.idle;
const cur = { c1:target.c1.slice(), c2:target.c2.slice(), spin:target.spin, flow:target.flow, energy:target.energy, auto:0 };

// ── Build the node graph (concentric shells, a "crystalline sphere") ──────────
const GA = Math.PI*(3-Math.sqrt(5));
const nodes = [];
const SHELLS = [ {r:0.0,n:1,sz:3.2},{r:0.5,n:26,sz:2.3},{r:0.85,n:64,sz:1.8},{r:1.18,n:120,sz:1.3} ];
for(const sh of SHELLS){
  for(let k=0;k<sh.n;k++){
    let x,y,z;
    if(sh.n===1){ x=y=z=0; }
    else { const yy=1-(k+0.5)/sh.n*2, rad=Math.sqrt(Math.max(0,1-yy*yy)), th=k*GA;
           x=Math.cos(th)*rad*sh.r; y=yy*sh.r; z=Math.sin(th)*rad*sh.r; }
    nodes.push({ x,y,z, sz:sh.sz, rad:Math.hypot(x,y,z), phase:Math.random()*6.28,
                 col:0, sx:0, sy:0, persp:1 });
  }
}
// Colour position 0..1 across X (left=blue, right=magenta).
for(const nd of nodes) nd.col = Math.max(0, Math.min(1, (nd.x+1.2)/2.4));

// Edges: connect each node to its 2 nearest neighbours (computed once).
const edges = [];
const seen = new Set();
for(let i=0;i<nodes.length;i++){
  const a=nodes[i]; const d=[];
  for(let j=0;j<nodes.length;j++){ if(i===j)continue;
    const b=nodes[j]; const dd=(a.x-b.x)**2+(a.y-b.y)**2+(a.z-b.z)**2; d.push([dd,j]); }
  d.sort((p,q)=>p[0]-q[0]);
  for(let m=0;m<2;m++){ const j=d[m][1]; const key=i<j?i+'_'+j:j+'_'+i;
    if(!seen.has(key)){ seen.add(key); edges.push({a:i,b:j,phase:Math.random()*6.28}); } }
}
// Bucket edges by colour so the whole web draws in a handful of stroke calls.
const NB = 8;
for(const ed of edges){ const c=(nodes[ed.a].col+nodes[ed.b].col)*0.5;
  ed.bucket=Math.min(NB-1, Math.max(0, Math.round(c*(NB-1)))); }

// ── Starfield ─────────────────────────────────────────────────────────────────
let stars=[];
function makeStars(){ stars=[]; const n=Math.round(W*H/14000);
  for(let i=0;i<n;i++) stars.push({x:Math.random()*W,y:Math.random()*H,b:0.2+Math.random()*0.5,ph:Math.random()*6.28}); }
resize();

// ── Interaction ─────────────────────────────────────────────────────────────────
let rotX=-0.2, rotY=0.5, zoom=1, dragging=false, moved=false, autoSpin=true, lastX, lastY;
const pulses=[];
function addPulse(){ pulses.push(performance.now()/1000); if(pulses.length>5) pulses.shift(); }
cv.addEventListener('pointerdown', e=>{ dragging=true; moved=false; autoSpin=false; lastX=e.clientX; lastY=e.clientY; });
addEventListener('pointerup', ()=>{ if(dragging&&!moved) addPulse(); dragging=false; setTimeout(()=>autoSpin=true,2500); });
addEventListener('pointermove', e=>{ if(!dragging)return; const dx=e.clientX-lastX, dy=e.clientY-lastY;
  if(Math.abs(dx)+Math.abs(dy)>3) moved=true;
  rotY+=dx*0.006; rotX=Math.max(-1.4,Math.min(1.4,rotX+dy*0.006)); lastX=e.clientX; lastY=e.clientY; });
cv.addEventListener('wheel', e=>{ e.preventDefault(); zoom=Math.max(0.55,Math.min(2.4,zoom*(1-e.deltaY*0.0012))); }, {passive:false});

// ── Render loop ──────────────────────────────────────────────────────────────────
const D=3.4; let t=0, last=performance.now(), autoT=0;
let frames=0, fpsT=performance.now(), tier=0;

function pulseBoost(rad, now){
  let s=0;
  for(let k=0;k<pulses.length;k++){ const wave=(now-pulses[k])*1.2; if(wave>1.8) continue;
    const d=rad-wave; s += Math.exp(-(d*d)/0.02); }
  return s;
}

function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(now-last)/1000); last=now; t+=dt;
  const k=Math.min(1,dt*3);
  cur.c1=mix(cur.c1,target.c1,k); cur.c2=mix(cur.c2,target.c2,k);
  cur.spin=lerp(cur.spin,target.spin,k); cur.flow=lerp(cur.flow,target.flow,k);
  cur.energy=lerp(cur.energy,target.energy,k); cur.auto=lerp(cur.auto,target.auto,k);
  if(autoSpin) rotY+=cur.spin*dt;

  // Auto energy pulses when active.
  if(cur.auto>0.05){ autoT+=dt; if(autoT>cur.auto){ autoT=0; addPulse(); } }

  const cx=W/2, cy=H/2, scale=Math.min(W,H)*0.32*zoom;
  const cosX=Math.cos(rotX), sinX=Math.sin(rotX), cosY=Math.cos(rotY), sinY=Math.sin(rotY);
  const sizeK=Math.min(W,H)*0.022;
  const nowS=now/1000;

  // Background + starfield.
  ctx.globalCompositeOperation='source-over';
  const bg=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*0.7);
  bg.addColorStop(0,'#100726'); bg.addColorStop(1,'#04030a');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<stars.length;i++){ const s=stars[i]; const a=s.b*(0.4+0.6*Math.sin(t*2+s.ph));
    ctx.fillStyle='rgba(150,160,220,'+a.toFixed(3)+')'; ctx.fillRect(s.x,s.y,1.3,1.3); }

  // Project nodes.
  for(let n=0;n<nodes.length;n++){ const p=nodes[n];
    const x1=p.x*cosY+p.z*sinY, z1=-p.x*sinY+p.z*cosY;
    const y2=p.y*cosX-z1*sinX, z2=p.y*sinX+z1*cosX;
    const persp=D/(D-z2); p.sx=cx+x1*persp*scale; p.sy=cy-y2*persp*scale; p.persp=persp; }

  // Connections — built into NB colour buckets, ~8 stroke calls total.
  const paths=[]; for(let i=0;i<NB;i++) paths.push(new Path2D());
  for(let e=0;e<edges.length;e++){ const ed=edges[e]; const a=nodes[ed.a], b=nodes[ed.b];
    const pth=paths[ed.bucket]; pth.moveTo(a.sx,a.sy); pth.lineTo(b.sx,b.sy); }
  ctx.lineWidth=0.8;
  for(let i=0;i<NB;i++){ const c=mix(cur.c1,cur.c2,i/(NB-1));
    const flow=0.5+0.5*Math.sin(t*cur.flow+i*0.9);
    const al=Math.min(0.7,(0.10+0.13*flow)*cur.energy);
    ctx.strokeStyle=rgba(c,al); ctx.stroke(paths[i]); }

  // Nodes — crisp solid dots (no blur).
  for(let n=0;n<nodes.length;n++){ const p=nodes[n];
    const breath=0.55+0.45*Math.sin(t*1.6+p.phase);
    const boost=pulseBoost(p.rad,nowS);
    const a=Math.min(1,(0.5+0.5*breath)*cur.energy+boost);
    const r=(1.0+p.sz*0.55)*p.persp*(1+boost*0.5);
    const c=mix(cur.c1,cur.c2,p.col);
    ctx.fillStyle=rgba(c,a);
    ctx.beginPath(); ctx.arc(p.sx,p.sy, r, 0, 6.2832); ctx.fill(); }

  // Adaptive: thin edges, then drop DPR.
  frames++; if(now-fpsT>=1000){ const fps=frames*1000/(now-fpsT); frames=0; fpsT=now;
    if(fps<30 && tier<2){ tier++; if(tier===2 && DPR>1){ DPR=1; resize(); } } }
}
requestAnimationFrame(frame);

// ── Chat panel ────────────────────────────────────────────────────────────────
const logEl=document.getElementById('log');
let curBot=null;
function addMsg(who,text,cls){ const d=document.createElement('div'); d.className='msg '+cls;
  const w=document.createElement('span'); w.className='who'; w.textContent=who; d.appendChild(w);
  const t=document.createTextNode(text||''); d.appendChild(t); d._t=t;
  logEl.appendChild(d); logEl.scrollTop=logEl.scrollHeight; return d; }
function toggleChat(show){ const c=document.getElementById('chat');
  const open=show===undefined?c.classList.contains('hidden'):show;
  c.classList.toggle('hidden',!open); document.body.classList.toggle('chat-open',open); }
document.getElementById('chatToggle').onclick=()=>toggleChat();
document.getElementById('chatClose').onclick=()=>toggleChat(false);

// ── Bridge: Python -> page ──────────────────────────────────────────────────────
window.patroam = {
  setState(name){ if(STATES[name]){ target=STATES[name]; addPulse(); } },
  setStatus(msg){ document.getElementById('status').textContent = msg || ''; },
  setModels(list){ const sel=document.getElementById('model'); sel.innerHTML='';
    (list&&list.length?list:['(no models)']).forEach(m=>{ const o=document.createElement('option'); o.value=o.textContent=m; sel.appendChild(o); }); },
  chatUser(text){ addMsg('You', text, 'you'); },
  chatToken(text){ if(!curBot) curBot=addMsg('PATROAM','','bot'); curBot._t.textContent+=text; logEl.scrollTop=logEl.scrollHeight; },
  chatDone(text){ if(curBot){ if(text) curBot._t.textContent=text; } else { addMsg('PATROAM', text||'', 'bot'); } curBot=null; },
};

// ── Bridge: page -> Python ────────────────────────────────────────────────────────
const api=()=> (window.pywebview && window.pywebview.api) || null;
const $=(id)=>document.getElementById(id);
$('send').onclick=()=>{ const v=$('text').value.trim(); if(v&&api()){ api().send(v); $('text').value=''; } };
$('text').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); $('send').onclick(); } });
$('model').onchange=()=>{ api()&&api().set_model($('model').value); };
$('refresh').onclick=async()=>{ if(api()){ const m=await api().get_models(); window.patroam.setModels(m); } };
let ttsOn=true;
$('tts').onclick=()=>{ ttsOn=!ttsOn; $('tts').classList.toggle('on',ttsOn); api()&&api().set_tts(ttsOn); };
const mic=$('mic');
const press=()=>{ api()&&api().record_start(); mic.classList.add('rec'); mic.textContent='● Rec'; };
const release=()=>{ if(!mic.classList.contains('rec'))return; mic.classList.remove('rec'); mic.textContent='🎙 Hold'; api()&&api().record_stop(); };
mic.addEventListener('mousedown',press); mic.addEventListener('mouseup',release); mic.addEventListener('mouseleave',release);
mic.addEventListener('touchstart',e=>{e.preventDefault();press();}); mic.addEventListener('touchend',e=>{e.preventDefault();release();});
let wakeOn=false;
function applyWake(on){ wakeOn=on; $('wake').classList.toggle('on',on);
  $('wake').textContent = on?'👂 Always-on':'😴 Always-on';
  mic.disabled=on; mic.style.opacity=on?.4:1; }
window.patroam.setWake = applyWake;   // Python pushes the auto-start state here
$('wake').onclick=async()=>{ if(!api())return; applyWake(await api().toggle_always_on()); };

// ── Inspector (RAG + knowledge graph) ─────────────────────────────────────────
function esc(s){ return (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
const insp=$('insp');
function kgTabActive(){ return insp.classList.contains('open') && $('pane-kg').classList.contains('sel'); }
function toggleInsp(show){ const open=show===undefined?!insp.classList.contains('open'):show;
  insp.classList.toggle('open',open);
  if(open){ loadGraph(); loadRag(); } else { setFull(false); stopGraphAnim(); } }
$('inspToggle').onclick=()=>toggleInsp();
$('inspClose').onclick=()=>toggleInsp(false);
document.querySelectorAll('.tab').forEach(tb=>{ tb.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('sel'));
  document.querySelectorAll('.pane').forEach(x=>x.classList.remove('sel'));
  tb.classList.add('sel'); const t=tb.dataset.tab; $('pane-'+t).classList.add('sel');
  if(t==='kg') loadGraph(); else { setFull(false); stopGraphAnim(); loadRag(); }
}; });

// Fullscreen: .insp has a transform + backdrop-filter, which would trap a
// position:fixed child inside the panel. So we reparent the graph to <body>
// while expanded (true viewport fullscreen), then restore it on collapse.
let gwHome=null;
function setFull(on){
  const gw=$('graphWrap'); if(!gw) return;
  if(on && !gw.classList.contains('full')){
    gwHome=document.createComment('gw-home'); gw.parentNode.insertBefore(gwHome, gw);
    document.body.appendChild(gw); gw.classList.add('full');
  } else if(!on && gw.classList.contains('full')){
    gw.classList.remove('full');
    if(gwHome && gwHome.parentNode){ gwHome.parentNode.insertBefore(gw, gwHome); gwHome.remove(); }
    gwHome=null;
  }
}
$('gExpand').onclick=(e)=>{ e.stopPropagation(); setFull(!$('graphWrap').classList.contains('full')); };
addEventListener('keydown',e=>{ if(e.key==='Escape') setFull(false); });

// ── 3D knowledge graph (Canvas2D projection — rotate / drag / zoom / click) ─────
const G={ nodes:[], edges:[], byId:{}, run:false, raf:0, t:0, hot:0, sel:null,
  rotX:-0.18, rotY:0.5, zoom:1.1, spin:true };
const PROJ_D=3.6;

function build3D(triples){
  const prev={}; G.nodes.forEach(n=>prev[n.id]={x:n.x,y:n.y,z:n.z,vx:n.vx,vy:n.vy,vz:n.vz});
  const idx={}, N=[];
  const names=[...new Set(triples.flatMap(t=>[t.s,t.o]))];
  names.forEach((n,i)=>{ const p=prev[n]; idx[n]=i;
    const u=Math.random()*6.283, v=Math.acos(2*Math.random()-1), rr=0.5+Math.random()*0.4;
    N.push({ id:n, deg:0, ph:Math.random()*6.28, born:p?1:0,
      x:p?p.x:rr*Math.sin(v)*Math.cos(u), y:p?p.y:rr*Math.cos(v), z:p?p.z:rr*Math.sin(v)*Math.sin(u),
      vx:p?p.vx:0, vy:p?p.vy:0, vz:p?p.vz:0, sx:null, sy:null, r:3, depth:0 }); });
  const E=triples.filter(t=>idx[t.s]!=null&&idx[t.o]!=null)
    .map(t=>({ a:idx[t.s], b:idx[t.o], rel:t.r.replace(/_/g,' ').toLowerCase(), p:Math.random() }));
  E.forEach(e=>{ N[e.a].deg++; N[e.b].deg++; });
  G.nodes=N; G.edges=E; G.byId={}; N.forEach(n=>G.byId[n.id]=n); G.hot=1;
  if(G.sel && !G.byId[G.sel]) G.sel=null;
}

function step3D(){
  const N=G.nodes, E=G.edges;
  for(let i=0;i<N.length;i++){ const a=N[i];
    for(let j=i+1;j<N.length;j++){ const b=N[j];
      let dx=a.x-b.x, dy=a.y-b.y, dz=a.z-b.z, d2=dx*dx+dy*dy+dz*dz||0.001, d=Math.sqrt(d2);
      const rep=0.3/d2, fx=dx/d*rep, fy=dy/d*rep, fz=dz/d*rep;
      a.vx+=fx;a.vy+=fy;a.vz+=fz; b.vx-=fx;b.vy-=fy;b.vz-=fz; }
    a.vx+=-a.x*0.02; a.vy+=-a.y*0.02; a.vz+=-a.z*0.02; }
  const L=0.72;
  for(const e of E){ const a=N[e.a], b=N[e.b];
    let dx=b.x-a.x,dy=b.y-a.y,dz=b.z-a.z,d=Math.hypot(dx,dy,dz)||0.001,f=(d-L)*0.04;
    const fx=dx/d*f,fy=dy/d*f,fz=dz/d*f;
    a.vx+=fx;a.vy+=fy;a.vz+=fz; b.vx-=fx;b.vy-=fy;b.vz-=fz; }
  const cap=G.hot>0.02?0.06:0.018;
  for(const a of N){ a.vx*=0.85;a.vy*=0.85;a.vz*=0.85;
    a.x+=Math.max(-cap,Math.min(cap,a.vx)); a.y+=Math.max(-cap,Math.min(cap,a.vy)); a.z+=Math.max(-cap,Math.min(cap,a.vz));
    // Keep nodes inside a safe sphere so projection can never blow up.
    a.x=Math.max(-2,Math.min(2,a.x)); a.y=Math.max(-2,Math.min(2,a.y)); a.z=Math.max(-2,Math.min(2,a.z));
    if(a.born<1) a.born=Math.min(1,a.born+0.04); }
  G.hot*=0.97;
}

function render3D(){
  const gcv=$('graphCv'), x=gcv.getContext('2d');
  const rect=gcv.getBoundingClientRect(), dpr=Math.min(devicePixelRatio||1,2);
  const w=Math.round(rect.width*dpr), h=Math.round(rect.height*dpr);
  if(gcv.width!==w||gcv.height!==h){ gcv.width=w; gcv.height=h; }
  x.setTransform(dpr,0,0,dpr,0,0);
  const W=rect.width, H=rect.height; x.clearRect(0,0,W,H);
  if(!G.nodes.length){ x.fillStyle='#6b7488'; x.font='13px monospace'; x.textAlign='center';
    x.fillText('Knowledge graph is empty.', W/2, H/2); return; }
  if(G.hot>0.03) step3D();   // settle, then freeze positions so nodes stop shaking
  // Rotation: focus on the selected node, else slow auto-spin (like the orb).
  const selN=G.sel?G.byId[G.sel]:null;
  if(selN && !gDrag && G.focus){ const rr=Math.hypot(selN.x,selN.z);
    const tY=Math.atan2(-selN.x, selN.z||0.001), tX=Math.atan2(selN.y, rr||0.001);
    G.rotY+=(tY-G.rotY)*0.07; G.rotX+=(tX-G.rotX)*0.07;
    if(Math.abs(tY-G.rotY)<0.01 && Math.abs(tX-G.rotX)<0.01) G.focus=false; }
  else if(!G.sel && G.spin && !gDrag){ G.rotY+=0.0016; }
  const full=$('graphWrap').classList.contains('full');
  const cx=W/2, cy=H/2, scale=Math.min(W,H)*0.34*G.zoom;
  const cosX=Math.cos(G.rotX), sinX=Math.sin(G.rotX), cosY=Math.cos(G.rotY), sinY=Math.sin(G.rotY);
  for(const n of G.nodes){ const x1=n.x*cosY+n.z*sinY, z1=-n.x*sinY+n.z*cosY;
    const y2=n.y*cosX-z1*sinX, z2=n.y*sinX+z1*cosX;
    const persp=PROJ_D/Math.max(1.0, PROJ_D-z2);   // clamp denom → persp always finite & positive
    n.sx=cx+x1*persp*scale; n.sy=cy-y2*persp*scale; n.depth=z2;
    n.r=Math.max(0.6,(3.2+Math.min(8,n.deg*1.3))*persp*(full?1.35:1)*(0.4+0.6*n.born)); }
  // Neighbour set of the selection (for focus highlighting).
  let neigh=null;
  if(G.sel){ neigh=new Set([G.sel]); G.edges.forEach(e=>{ const a=G.nodes[e.a].id,b=G.nodes[e.b].id;
    if(a===G.sel)neigh.add(b); if(b===G.sel)neigh.add(a); }); }
  // Edges + flowing particles (additive glow).
  x.globalCompositeOperation='lighter';
  for(const e of G.edges){ const a=G.nodes[e.a], b=G.nodes[e.b];
    const on=!G.sel || a.id===G.sel || b.id===G.sel;
    const al=G.sel?(on?0.7:0.04):0.4;
    const grd=x.createLinearGradient(a.sx,a.sy,b.sx,b.sy);
    grd.addColorStop(0,'rgba(80,150,255,'+al+')'); grd.addColorStop(1,'rgba(176,96,255,'+al+')');
    x.strokeStyle=grd; x.lineWidth=(on&&G.sel?1.9:1.1)*(full?1.2:1);
    x.beginPath(); x.moveTo(a.sx,a.sy); x.lineTo(b.sx,b.sy); x.stroke();
    if(on){ e.p=(e.p+0.005)%1; const px=a.sx+(b.sx-a.sx)*e.p, py=a.sy+(b.sy-a.sy)*e.p;
      x.fillStyle='rgba(190,215,255,.95)'; x.beginPath(); x.arc(px,py,full?2.4:1.8,0,6.2832); x.fill(); }
    if((full||G.sel) && on){ x.globalCompositeOperation='source-over';
      x.fillStyle='rgba(160,176,255,.75)'; x.font='10px monospace'; x.textAlign='center';
      x.fillText(e.rel,(a.sx+b.sx)/2,(a.sy+b.sy)/2-3); x.globalCompositeOperation='lighter'; } }
  // Nodes, drawn back-to-front. Haloes first (additive), then crisp cores.
  const order=[...G.nodes].sort((p,q)=>p.depth-q.depth);
  for(const n of order){ const dim=G.sel && !neigh.has(n.id);
    const pulse=0.6+0.4*Math.sin(G.t*0.05+n.ph);
    const a=(dim?0.1:0.85)*pulse*n.born;
    const col=(n.id===G.sel)?'255,150,90':'150,120,255';
    const halo=x.createRadialGradient(n.sx,n.sy,0,n.sx,n.sy,n.r*3.4);
    halo.addColorStop(0,'rgba('+col+','+a+')'); halo.addColorStop(1,'rgba('+col+',0)');
    x.fillStyle=halo; x.beginPath(); x.arc(n.sx,n.sy,n.r*3.4,0,6.2832); x.fill(); }
  x.globalCompositeOperation='source-over';
  for(const n of order){ const dim=G.sel && !neigh.has(n.id);
    const rr=n.r*(n.id===G.sel?1.5:1);
    x.fillStyle=(n.id===G.sel)?'rgba(255,214,176,'+n.born+')':'rgba(232,236,255,'+(dim?0.22:1)*n.born+')';
    x.beginPath(); x.arc(n.sx,n.sy,rr,0,6.2832); x.fill();
    const showLab=(full || !G.sel || neigh.has(n.id)) && !dim;
    if(showLab){ x.fillStyle='rgba(223,227,255,'+n.born+')'; x.font=(full?'12px':'10px')+' monospace'; x.textAlign='center';
      const lab=n.id.length>(full?30:16)?n.id.slice(0,(full?29:15))+'…':n.id;
      x.fillText(lab, n.sx, n.sy-rr-5); } }
}

function gLoop(){
  if(!G.run){ G.raf=0; return; }
  G.raf=requestAnimationFrame(gLoop);          // schedule FIRST — a render error can't kill the loop
  try { G.t++; render3D(); } catch(err){ if(window.console) console.error('graph render error', err); }
}
function startGraphAnim(){ G.run=true; if(!G.raf) G.raf=requestAnimationFrame(gLoop); }  // restart even if a prior loop died
function stopGraphAnim(){ G.run=false; if(G.raf) cancelAnimationFrame(G.raf); G.raf=0; }

// Interaction: drag to rotate, wheel to zoom, click a node to focus.
const gcvEl=$('graphCv');
let gDrag=false, gMoved=false, gLX=0, gLY=0, gSpinTO=null;
gcvEl.addEventListener('pointerdown', e=>{ gDrag=true; gMoved=false; G.spin=false; gLX=e.clientX; gLY=e.clientY; });
addEventListener('pointermove', e=>{ if(!gDrag)return; const dx=e.clientX-gLX, dy=e.clientY-gLY;
  if(Math.abs(dx)+Math.abs(dy)>3) gMoved=true;
  G.rotY+=dx*0.008; G.rotX=Math.max(-1.45,Math.min(1.45,G.rotX+dy*0.008)); gLX=e.clientX; gLY=e.clientY; });
addEventListener('pointerup', e=>{ if(!gDrag)return; gDrag=false;
  if(!gMoved) pickAt(e.clientX, e.clientY);
  clearTimeout(gSpinTO); gSpinTO=setTimeout(()=>{ G.spin=true; }, 2500); });
gcvEl.addEventListener('wheel', e=>{ e.preventDefault();
  G.zoom=Math.max(0.5,Math.min(3.2,G.zoom*(1-e.deltaY*0.0012))); }, {passive:false});

function pickAt(clientX, clientY){
  const rect=gcvEl.getBoundingClientRect(), mx=clientX-rect.left, my=clientY-rect.top;
  let best=null, bestD=1e9;
  for(const n of G.nodes){ if(n.sx==null)continue; const d=Math.hypot(n.sx-mx, n.sy-my);
    if(d<Math.max(15, n.r+7) && d<bestD){ bestD=d; best=n; } }
  if(best) selectNode(best.id); else clearSel();
}
function selectNode(id){ G.sel=id; G.focus=true; renderDetail(); }
function clearSel(){ G.sel=null; renderDetail(); }

// Find a node by name: exact → substring → name contained in a phrase.
function findNode(q){ q=(q||'').toLowerCase().trim(); if(!q||!G.nodes.length) return null;
  let m=G.nodes.find(n=>n.id.toLowerCase()===q); if(m) return m;
  m=G.nodes.find(n=>n.id.toLowerCase().includes(q)); if(m) return m;
  let best=null; for(const n of G.nodes){ const id=n.id.toLowerCase();
    if(q.includes(id) && (!best||id.length>best.id.length)) best=n; }
  return best;
}
// Called by Python when you ask PATROAM about something — focus the node if any.
window.patroam.focusFromText=function(text){
  if(!text || !insp.classList.contains('open') || !G.nodes.length) return;
  const n=findNode(text); if(!n) return;
  if(!$('pane-kg').classList.contains('sel')){ const tb=document.querySelector('.tab[data-tab="kg"]'); if(tb) tb.click(); }
  selectNode(n.id);
};
// Search bar: focus a node as you type / on Enter.
$('kgSearch').addEventListener('input', e=>{ const v=e.target.value.trim();
  if(!v){ clearSel(); return; } const n=findNode(v); if(n) selectNode(n.id); });
$('kgSearch').addEventListener('keydown', e=>{ if(e.key==='Enter'){ const n=findNode(e.target.value);
  if(n){ selectNode(n.id); } } e.stopPropagation(); });

function renderDetail(){
  const dEl=$('kgDetail'), oEl=$('kgOverlay');
  if(!G.sel){ dEl.innerHTML=''; oEl.innerHTML=''; oEl.classList.remove('show'); return; }
  const out=[], inc=[];
  G.edges.forEach(e=>{ const a=G.nodes[e.a].id, b=G.nodes[e.b].id;
    if(a===G.sel) out.push({rel:e.rel, other:b});
    if(b===G.sel) inc.push({rel:e.rel, other:a}); });
  const deg=out.length+inc.length;
  let html='<div class="detail-title">'+esc(G.sel)+'<span class="detail-clear">✕</span></div>'+
    '<div class="detail-sub">'+deg+' connection'+(deg!==1?'s':'')+'</div><div class="detail-rel">';
  out.forEach(c=> html+='<b>'+esc(G.sel)+'</b> <span class="r">'+esc(c.rel)+'</span> '+esc(c.other)+'<br>');
  inc.forEach(c=> html+=esc(c.other)+' <span class="r">'+esc(c.rel)+'</span> <b>'+esc(G.sel)+'</b><br>');
  if(!deg) html+='No connections recorded yet.';
  html+='</div>';
  dEl.innerHTML=html; oEl.innerHTML=html; oEl.classList.add('show');
  [dEl,oEl].forEach(el=>{ const c=el.querySelector('.detail-clear'); if(c) c.onclick=clearSel; });
}

async function loadGraph(){ if(!api())return;
  const r=await api().get_graph(), tr=(r&&r.triples)||[];
  build3D(tr); startGraphAnim(); renderDetail();
  $('kgMeta').innerHTML='<b>'+tr.length+'</b> relationships · <b>'+
    new Set(tr.flatMap(t=>[t.s,t.o])).size+'</b> entities · <span style="opacity:.6">drag · scroll · click a node</span>';
  $('kgList').innerHTML = tr.length ? tr.map(t=>
    esc(t.s)+' <span class="rel">'+esc(t.r.replace(/_/g,' ').toLowerCase())+'</span> '+esc(t.o)).join('<br>')
    : '<div class="empty">No facts yet. Say e.g. "remember that Orion uses Postgres", or "connect Orion to Helios".</div>';
}

async function loadRag(){ if(!api())return;
  const r=(await api().get_rag())||{};
  $('ragMeta').innerHTML='Backend: <b>'+esc(r.backend||'unknown')+'</b> · <b>'+(r.chunks||0)+'</b> chunks';
  $('ragSources').innerHTML=(r.sources&&r.sources.length)
    ? r.sources.map(s=>'<span class="chip">'+esc(s)+'</span>').join('')
    : '<div class="empty">No documents indexed. Drop files in your PATROAM knowledge folder, then Re-index.</div>';
}

async function ragSearch(){ if(!api())return; const q=$('ragQ').value.trim(); if(!q)return;
  $('ragHits').innerHTML='<div class="empty">Searching…</div>';
  const r=await api().rag_query(q), hits=(r&&r.hits)||[];
  $('ragHits').innerHTML = hits.length ? hits.map(h=>
    '<div class="hit"><span class="src">'+esc(h.source||'(unknown)')+'</span>'+
    (h.score!=null?'<span class="score">'+h.score+'</span>':'')+
    '<div class="txt">'+esc(h.text||'')+'</div></div>').join('')
    : '<div class="empty">No matching passages found.</div>';
}
$('ragGo').onclick=ragSearch;
$('ragQ').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); ragSearch(); } });
$('ragReindex').onclick=async()=>{ if(!api())return; $('ragMeta').textContent='Re-indexing & extracting graph… (may take a moment)';
  const r=await api().reindex(); await loadRag();
  if(r&&!r.error) $('ragMeta').innerHTML+=' · indexed <b>'+(r.files||0)+'</b> files, <b>'+(r.triples||0)+'</b> graph facts';
  loadGraph();   // documents may have added nodes
};

// Python calls this after each turn so the panel reflects new facts/docs live.
window.patroam.inspectorChanged=function(){ if(!insp.classList.contains('open'))return;
  if(kgTabActive()) loadGraph(); loadRag(); };

let booted=false;
function boot(){ if(booted)return; const a=api(); if(!a){ setTimeout(boot,120); return; }
  booted=true;
  a.ready().then(info=>{ if(!info)return; window.patroam.setModels(info.models||[]);
    ttsOn=info.tts!==false; $('tts').classList.toggle('on',ttsOn); if(info.state) window.patroam.setState(info.state); }); }
window.addEventListener('pywebviewready', boot);
setTimeout(boot, 400);
</script>
